credentials:
  nutanix:
  - id: example_source_67
    username: admin
    password_env: NUTANIX_NTX_ADMIN_PROD_PASSWORD
  - id: example_source_71
    username: example_user_80
    password_env: NUTANIX_NTX_SERVICE_SITE_C_PASSWORD
  vmware:
  - id: example_source_73
    username: example_user_33
    password_env: VMWARE_VC_ADMIN_PROD_PASSWORD
  - id: example_source_75
    username: root
    password_env: VMWARE_ESXI_ADMIN_SITE_A_PASSWORD
sources:
  nutanix:
  - name: example_source_84
    base_url: https://nutanix-a.example.com:9440
    credential_id: example_source_67
    proxy_feature: nutanix_api
    verify_ssl: true
    ca_bundle: certs/internal-ca-chain.pem
    api_limit: 500
    request_delay: 0.5
  - name: example_source_86
    base_url: https://nutanix-inline.example.com:9440
    username: admin
    password_env: NUTANIX_INLINE_PASSWORD
    proxy_feature: nutanix_api
    verify_ssl: true
    ca_bundle: certs/internal-ca-chain.pem
    api_limit: 500
    request_delay: 0.5
  vmware:
  - name: example_source_87
    host: vcenter-a.example.com
    credential_id: example_source_73
    proxy_feature: vmware_api
    port: 443
    verify_ssl: true
    ca_bundle: certs/internal-ca-chain.pem
    host_type: vcenter
  - name: example_source_89
    host: esxi-inline.example.com
    username: root
    password_env: VMWARE_INLINE_PASSWORD
    proxy_feature: vmware_api
    port: 443
    verify_ssl: true
    ca_bundle: certs/internal-ca-chain.pem
    host_type: esxi
report:
  output_prefix: vm_asset_inventory_report
  summary_group_by:
  - source_provider
  - source_platform
  - powerstate
  filters:
    providers: []
    platforms: []
    powerstates: []
    vmname_contains: ''
    cluster_contains: ''
    min_ram_mib: 0
    min_disk_gb: 0
    require_ip: false
output:
  mode: auto
  debug_files: false
  sqlserver:
    enabled: false
    server: ''
    local_server: ''
    connection_mode: auto
    database: ExampleInventory
    authentication: integrated
    username: ''
    password_env: ''
    table_map:
      nutanix: src_nutanix.VirtualMachine
      vmware: src_vmware.VirtualMachine
